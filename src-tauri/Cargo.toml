[package]
name = "Totkbits"
version = "1.0.1"
description = "A Tauri App"
authors = ["Banan039/SolidLink95"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# zstud-sys = {git = "https://github.com/SolidLink95/zstud-sys-rs"}
#BymlText
ryml = { version = "0.3.2", features = ["std"] }
miow = "0.6.0"
# meshcodec_bindings = { path = "../tmp/MeshCodec/bindings" }
meshcodec_bindings = { git = "https://github.com/SolidLink95/MeshCodec" }
xlink2_bindings = { git = "https://github.com/SolidLink95/xlink2" }
roead = { git = "https://github.com/SolidLink95/roead", features = ["yaml", "sarc", "byml"] }
# roead = { git = "https://github.com/SolidLink95/roead", features = ["yaml", "sarc", "byml"] }

regex = "1.10.4"
# glob = "0.3"
# msbt_bindings_rs = {path = "W:/coding/msbt_bindings_rs"}
tauri = { version = "2.11.1", features = [] }
serde = { version = "1", features = ["derive"] }
# tauri-bundler = "1.5.1"
encoding_rs = "0.8"
zstd = { version = "0.13.2", features = ["experimental"] }
libloading = "0.8.3"
tegra_swizzle = "0.3.1"
fbxcel-dom = "0.0.10"
fbxcel = "0.9.0"
mikktspace = "0.3.0"
# roead = { path = "./external/roead", features = ["yaml", "sarc", "byml"] }
# roead = { version = "1.0.0", features = ["yaml", "sarc", "byml"] }
#roead = { version = "0.25.1", features = ["yaml", "sarc", "byml"] }
serde_json = "1.0"
uuid = { version = "1.8", features = ["v4"] }
gltf-json = { version = "1.4.1", features = ["names"] }
indexmap = { version = "2", features = ["serde"] }
rfd = "0.17.2"
native-dialog = "0.9.7"
natord = "1.0.9"
bitvec = "1.0.1"
# rayon = "1"
#serde_derive = "1" 
serde_yaml = "0.9.32"
walkdir = "2"
zip = { version = "2.2.2", default-features = false, features = ["deflate"] }
sevenz-rust = "0.6.1"
byteordered = "0.6.0"
sha2 = "0.10"
digest = "0.10"
fs2 = "0.4"
base64 = "0.22.1"
aes = "0.8.4"
rqrr = "0.10.1"
symphonia = { version = "0.5.4", features = ["mp3", "wav", "pcm"] }
shine-rs = "0.1.3"
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "tga",
    "tiff",
    "webp",
] }
image_dds = { version = "0.7.2", default-features = false, features = [
    "ddsfile",
    "image",
    "encode",
] }
flate2 = { version = "1.0.35", features = ["zlib-rs"] }
windows = { version = "0.58.0", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
] }
toml = "0.8.19"
winreg = "0.52.0"
reqwest = { version = "0.12.12", features = ["blocking", "json"] }
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-fs = "2.5.1"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-process = "2.3.1"
tauri-plugin-http = "2.5.9"
tauri-plugin-os = "2.3.2"
texture2ddecoder = "0.1.2"

[dev-dependencies]
windows = "0.58.0"

# texture2ddecoder's ASTC decoder relies on wrapping integer arithmetic; with
# debug overflow checks it panics on textures that decode correctly in release
# (and in the validated Python reference). Match release semantics in dev, and
# optimize the decoder so dev-build texture loading stays usable.
[profile.dev.package.texture2ddecoder]
overflow-checks = false
opt-level = 2

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2.3.2"
# yaml = ["serde_yaml"]
